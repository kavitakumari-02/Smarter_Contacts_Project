<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="basestyle :: layout(~{::section})">

<section>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh;">

    <div class="col-md-4">

        <div class="card shadow-lg p-4">

            <div class="card-body">

                <h3 class="text-center mb-4">Login</h3>

                <!-- Error Message -->
                <div th:if="${param.error}" 
                     class="alert alert-danger text-center">
                    Invalid Username and Password
                </div>
				<!-- Logout Message -->
				               <div th:if="${param.logout}" 
				                    class="alert alert-success text-center">
				                  Successfully logged out!
				               </div>

                <!-- Form -->
                <form th:action="@{/do_login}" method="post">

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="text" name="username" 
                               class="form-control" placeholder="Enter email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" 
                               class="form-control" placeholder="Enter password">
                    </div>

                    <button type="submit" 
                            class="btn btn-primary w-100">
                        Login
                    </button>
               
                </form>

				<a th:href="@{/oauth2/authorization/google(prompt='select_account')}"
				   class="btn btn-light border w-100 mt-3 d-flex align-items-center justify-content-center"
				   style="height: 45px;">

				    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
				         width="20"
				         height="20"
				         class="me-2"
				         alt="Google Logo">

				    <span>Login with Google</span>
				</a>

            </div>

        </div>

    </div>

</div>

</section>

</html>
