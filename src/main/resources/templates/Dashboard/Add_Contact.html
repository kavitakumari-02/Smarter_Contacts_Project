<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="Dashboard/base :: layout(~{::section})">

<section>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- TinyMCE -->
    <script src="https://cdn.tiny.cloud/1/894jvlnbda7hwg4rkskgknht3nok2i2nb323wwj2hc15uqge/tinymce/8/tinymce.min.js"
            referrerpolicy="origin"
            crossorigin="anonymous"></script>


    <!-- ================= ADD CONTACT PAGE ================= -->

    
	<div style="
	    background-color:white;
	    min-height:150vh;
	    padding: 20px 50px 50px;
	">

        <div class="container">

            <div class="card shadow p-4"
                 style="
                    background-color:#f5f5f5;
                    border-radius:10px;
                    max-width:800px;
                    margin:auto;
                 ">

                <!-- Heading -->

                <h2 class="text-center mb-4">
                    Add New Contact
                </h2>


                <!-- Success / Error Message -->

                <div th:if="${printingMsg}"
                     th:class="'alert alert-' + ${printingMsg.type}"
                     role="alert">

                    <h5 class="text-center"
                        th:text="${printingMsg.msgContent}">
                    </h5>

                </div>


                <!-- ================= FORM ================= -->

                <form th:action="@{/user/process-contact}"
                      method="post"
                      enctype="multipart/form-data"
                      th:object="${contact}">


                    <!-- FIRST NAME -->

                    <div class="mb-3">

                        <label class="form-label">
                            First Name
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="fa fa-user"></i>
                            </span>

                            <input type="text"
                                   th:field="*{firstName}"
                                   class="form-control"
                                   placeholder="Enter First Name here">

                        </div>

                        <p class="text-danger"
                           th:if="${#fields.hasErrors('firstName')}"
                           th:errors="*{firstName}">
                        </p>

                    </div>


                    <!-- LAST NAME -->

                    <div class="mb-3">

                        <label class="form-label">
                            Last Name
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="fa fa-user"></i>
                            </span>

                            <input type="text"
                                   th:field="*{lastName}"
                                   class="form-control"
                                   placeholder="Enter Last Name here">

                        </div>

                        <p class="text-danger"
                           th:if="${#fields.hasErrors('lastName')}"
                           th:errors="*{lastName}">
                        </p>

                    </div>


                    <!-- PHONE -->

                    <div class="mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="fa fa-phone"></i>
                            </span>

                            <input type="text"
                                   th:field="*{phone}"
                                   class="form-control"
                                   placeholder="Enter Phone Number here">

                        </div>

                        <p class="text-danger"
                           th:if="${#fields.hasErrors('phone')}"
                           th:errors="*{phone}">
                        </p>

                    </div>


                    <!-- EMAIL -->

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="fa fa-envelope"></i>
                            </span>

                            <input type="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   placeholder="Enter Email here">

                        </div>

                        <p class="text-danger"
                           th:if="${#fields.hasErrors('email')}"
                           th:errors="*{email}">
                        </p>

                    </div>


                    <!-- PROFESSION -->

                    <div class="mb-3">

                        <label class="form-label">
                            Profession
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="fa fa-briefcase"></i>
                            </span>

                            <input type="text"
                                   th:field="*{profession}"
                                   class="form-control"
                                   placeholder="Enter Profession here">

                        </div>

                        <p class="text-danger"
                           th:if="${#fields.hasErrors('profession')}"
                           th:errors="*{profession}">
                        </p>

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea class="form-control"
                                  rows="6"
                                  placeholder="Enter contact description"
                                  th:field="*{description}">
                        </textarea>

                        <p class="text-danger"
                           th:if="${#fields.hasErrors('description')}"
                           th:errors="*{description}">
                        </p>

                    </div>


                    <!-- IMAGE -->

                    <div class="mb-3">

                        <label class="form-label">
                            Contact Image
                        </label>

                        <input type="file"
                               class="form-control"
                               name="profileImage"
                               accept="image/*">

                    </div>


                    <!-- BUTTONS -->

                    <div class="text-center mt-4">

                        <button type="submit"
                                class="btn btn-primary me-2">

                            Save Contact

                        </button>


                        <button type="button"
                                class="btn btn-secondary"
                                onclick="history.back()">

                            Back

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- Dashboard JS -->

    <script th:src="@{/js/dashboard.js}"></script>


    <!-- TinyMCE -->

    <script>

        tinymce.init({
            selector: 'textarea',
            height: 250,
            menubar: false,
            plugins: 'lists link',
            toolbar: 'undo redo | bold italic | bullist numlist | link'
        });

    </script>

</section>

</html>
